<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Restaurant Landing Page</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,400&family=Montserrat:wght@500;700;800&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

    <!-- Preset Switcher & Color Customizer -->
    <aside class="theme-switcher">
        <span class="switcher-label">Preset:</span>
        <button type="button" class="btn-preset" onclick="switchBrand('steakhouse')">Steakhouse</button>
        <button type="button" class="btn-preset" onclick="switchBrand('bistro')">Green Bistro</button>
        <button type="button" class="btn-preset" onclick="switchBrand('seafood')">Seafood</button>

        <!-- Nút Bánh Xe Màu -->
        <button type="button" id="toggle-color-picker" class="btn-color-wheel" title="Tùy chỉnh màu sắc"></button>

        <!-- Popover chọn màu -->
        <div class="color-picker-popover" id="color-picker-panel">
            <div class="picker-header">Tùy biến bảng màu</div>
            <div class="picker-item">
                <span>Màu chính (Primary):</span>
                <label class="custom-color-swatch">
                    <input type="color" id="input-color-primary" value="#D4AF37">
                    <span class="swatch-circle" id="preview-primary"></span>
                </label>
            </div>
            <div class="picker-item">
                <span>Màu chữ (Font Text):</span>
                <label class="custom-color-swatch">
                    <input type="color" id="input-color-text" value="#F5F5F5">
                    <span class="swatch-circle" id="preview-text"></span>
                </label>
            </div>
            <div class="picker-item">
                <span>Nền trang (Background):</span>
                <label class="custom-color-swatch">
                    <input type="color" id="input-color-bg" value="#0d0d0d">
                    <span class="swatch-circle" id="preview-bg"></span>
                </label>
            </div>
            <div class="picker-item">
                <span>Màu thẻ (Card):</span>
                <label class="custom-color-swatch">
                    <input type="color" id="input-color-card" value="#171717">
                    <span class="swatch-circle" id="preview-card"></span>
                </label>
            </div>
        </div>
    </aside>

    <!-- 1. HEADER -->
    <header class="header">
        <a href="#hero" class="logo" id="brand-logo"></a>

        <nav class="nav-menu" id="nav-links"></nav>

        <a href="#booking" class="btn-highlight" id="nav-cta"></a>
    </header>

    <main>
        <!-- 2. HERO SECTION -->
        <section class="hero-full" id="hero">
            <div class="hero-backdrop" id="hero-backdrop"></div>
            <div class="hero-overlay"></div>

            <div class="hero-container">
                <div class="hero-content">
                    <span class="badge" id="hero-badge"></span>
                    <h1 id="hero-title"></h1>
                    <p id="hero-desc"></p>

                    <div class="hero-actions">
                        <a href="#booking" class="btn-primary" id="hero-primary-cta"></a>
                        <a href="#menu" class="btn-outline" id="hero-secondary-cta"></a>
                    </div>
                </div>
            </div>
        </section>

        <!-- 3. BRAND STORY SECTION (Dữ liệu động) -->
        <section class="story-section" id="story">
            <div class="story-wrapper">
                <span class="section-tag" id="story-tagline"></span>
                <h2 id="story-title"></h2>
                <p id="story-desc"></p>
                <div class="stats-grid" id="story-stats"></div>
            </div>
        </section>

        <!-- 4. MENU SECTION -->
        <section class="menu-section" id="menu">
            <div class="section-header">
                <h2 id="menu-title"></h2>
                <p id="menu-desc"></p>
            </div>
            <div class="menu-grid" id="menu-container"></div>
        </section>

        <!-- 5. SPACE & ATMOSPHERE SECTION (Bento Grid động) -->
        <section class="space-section" id="space">
            <div class="space-header">
                <span class="section-tag" id="space-tagline"></span>
                <h2 id="space-title"></h2>
                <p id="space-desc" class="space-subtitle"></p>
            </div>

            <div class="space-bento-grid" id="space-gallery"></div>
        </section>

        <!-- 6. CUSTOMER REVIEWS SECTION (Dữ liệu động) -->
        <section class="reviews-section" id="reviews">
            <div class="section-header">
                <h2 id="reviews-title"></h2>
                <p id="reviews-desc"></p>
            </div>
            <div class="reviews-grid" id="reviews-container"></div>
        </section>

        <!-- 7. BOOKING SECTION (Dữ liệu động) -->
        <section class="booking-section" id="booking">
            <div class="booking-card">
                <h2 id="booking-title"></h2>
                <p id="booking-desc"></p>

                <form class="booking-form" id="reservation-form">
                    <div class="form-row">
                        <input type="text" id="booking-name" placeholder="Họ và tên *" required>

                        <input type="tel" 
                        id="booking-phone" 
                        placeholder="Số điện thoại (10 số) *" 
                        maxlength="10"
                        inputmode="numeric" pattern="0[0-9]{9}" required>
                    </div>
                    <textarea rows="3" placeholder="Ghi chú đặc biệt (kỷ niệm, bàn ngoài trời, dị ứng...)"></textarea>
                    <button type="submit" class="btn-primary btn-block" id="booking-submit-btn">Xác Nhận Đặt
                        Bàn</button>
                </form>
            </div>
        </section>
    </main>

    <!-- 8. FOOTER -->
    <footer class="footer-modern" id="footer">
        <div class="footer-grid">
            <!-- Cột 1 -->
            <div class="footer-col col-brand">
                <div class="brand-badge-box">
                    <span class="brand-letter" id="footer-logo-initial"></span>
                    <h3 id="footer-brand-title"></h3>
                </div>
                <p class="brand-subtext" id="footer-brand-desc"></p>
                <a href="#booking" class="btn-footer-cta" id="footer-cta-btn"></a>
            </div>

            <!-- Cột 2 -->
            <div class="footer-col col-nav">
                <h4>Điều Hướng</h4>

                <ul id="footer-nav-list"></ul>
            </div>

            <!-- Cột 3 -->
            <div class="footer-col col-contact">
                <div class="contact-block">
                    <p class="contact-address" id="footer-address-text"></p>
                    <p class="parking-info" id="footer-parking-info"></p>
                </div>
                <div class="contact-block">
                    <a href="#" class="hotline-link" id="footer-phone-link"></a>
                    <p class="email-text" id="footer-email-text"></p>
                </div>
                <div class="contact-block">
                    <div class="hours-list" id="footer-hours-list"></div>
                </div>
            </div>

            <!-- Cột 4 -->
            <div class="footer-col col-social">
                <h4>Kết nối</h4>
                <div class="social-links" id="footer-social-links"></div>
            </div>
        </div>

        <div class="footer-copyright">
            <p>Web Design 2026 White Label Landing Page. CHẠY DEADLINE CHO VUI.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="./assets/js/theme.js"></script>
    <script src="./assets/js/render.js"></script>
    <script src="./assets/js/fetch.js"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
